name: Release

# Push a tag like v0.1.0 to build installers for every platform into a draft release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          # WiX (.msi) fails on current Windows runners; the NSIS setup.exe works everywhere.
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NitPick ${{ github.ref_name }}
          releaseBody: |
            Find your monitor's best settings with guided test patterns. No calibration hardware needed. Available in English and Turkish.

            ## Download
            - **Windows:** `NitPick_x.y.z_x64-setup.exe`
            - **macOS:** `NitPick_x.y.z_aarch64.dmg` for Apple Silicon, `NitPick_x.y.z_x64.dmg` for Intel
            - **Linux:** `.AppImage`, `.deb` or `.rpm`

            Prefer not to install anything? Use the [web version](https://borasavkar.github.io/nitpick/).

            ## First launch
            These builds are not code-signed yet, so your system may warn you the first time:
            - **Windows:** if SmartScreen says "Windows protected your PC", click **More info → Run anyway**.
            - **macOS:** if the app is blocked, open **System Settings → Privacy & Security** and click **Open Anyway**. If macOS says the app "is damaged", run `xattr -cr /Applications/NitPick.app` in Terminal and open it again.
            - **Linux (AppImage):** make the file executable (`chmod +x NitPick_*.AppImage`) and run it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
